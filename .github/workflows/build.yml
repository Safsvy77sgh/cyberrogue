name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45  # ← BUG FIX #7: защита от зависания

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev openjdk-17-jdk zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip wget
        pip install buildozer cython

    # BUG FIX #1 + #5: кэшируем ТОЛЬКО то, что не ломается
    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/packages
          ~/.gradle
        key: buildozer-packages-v3
        restore-keys: |
          buildozer-packages-v3

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Перегрузка: Последний Протокол
        package.name = cyberrogue
        package.domain = org.cyberrogue
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json,ttf,otf
        version = 1.0.0
        requirements = python3,pygame-ce
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, VIBRATE
        android.api = 30
        android.minapi = 21
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.ndk = 25b
        android.allow_backup = True
        android.accept_sdk_license = True
        android.log_level = 2

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    # BUG FIX #1 + #4: ставим cmdline-tools и принимаем лицензии
    # ПОСЛЕ cache, но ДО buildozer. Используем printf вместо yes.
    - name: Setup Android SDK licenses
      run: |
        set -e
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR/cmdline-tools $SDK_DIR/tools/bin $SDK_DIR/licenses

        # Скачиваем cmdline-tools если их ещё нет
        if [ ! -f $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q -o cmdline.zip -d $SDK_DIR/cmdline-tools
          rm -rf $SDK_DIR/cmdline-tools/latest
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
        fi

        # Симлинки для старых версий buildozer
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager

        # Принимаем лицензии (printf надёжнее yes)
        printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | \
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true

        echo "SDK подготовлен:"
        ls -la $SDK_DIR/tools/bin/

    - name: Build APK
      id: build
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee build.log
      continue-on-error: false

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error

    # BUG FIX #6: если build.log нет — не падаем с новой ошибкой
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: ignore
        retention-days: 7
