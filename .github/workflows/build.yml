name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip wget
        pip install "cython<3.0" buildozer

    - name: Install Gradle 8.0.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip
        sudo unzip -q gradle-8.0.2-bin.zip -d /opt/
        sudo ln -sfn /opt/gradle-8.0.2 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/packages
          ~/.gradle
        key: buildozer-packages-v7
        restore-keys: buildozer-packages-v7

    - name: Verify buildozer.spec exists
      run: |
        ls -la buildozer.spec
        echo "=== Содержимое buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee build.log
      continue-on-error: false

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: ignore
        retention-days: 7
