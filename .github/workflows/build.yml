name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ГЛАВНОЕ ИСПРАВЛЕНИЕ: Java 17 вместо 11
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java version
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip wget
        pip install buildozer cython

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/packages
          ~/.gradle
        key: buildozer-packages-v4
        restore-keys: |
          buildozer-packages-v4

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Перегрузка: Последний Протокол
        package.name = cyberrogue
        package.domain = org.cyberrogue
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json,ttf,otf
        version = 1.0.0
        requirements = python3,pygame-ce
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, VIBRATE
        android.api = 30
        android.minapi = 21
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.ndk = 25b
        android.allow_backup = True
        android.accept_sdk_license = True
        android.log_level = 2

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Setup Android SDK cmdline-tools and licenses
      run: |
        set -e
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR/cmdline-tools $SDK_DIR/tools/bin $SDK_DIR/licenses

        # Проверяем Java (должна быть 17)
        java -version

        # Скачиваем cmdline-tools если их нет
        if [ ! -f $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q -o cmdline.zip -d $SDK_DIR/cmdline-tools
          rm -rf $SDK_DIR/cmdline-tools/latest
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
        fi

        # Симлинки для старых версий buildozer
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager

        # Принимаем лицензии (printf надёжнее yes)
        printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | \
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true

        # Устанавливаем build-tools и platform
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" "platforms;android-30" "build-tools;30.0.3" || true

        echo "=== SDK готов ==="
        ls -la $SDK_DIR/tools/bin/
        ls -la $SDK_DIR/

    - name: Build APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee build.log
      continue-on-error: false

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: ignore
        retention-days: 7
