name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: buildozer-v1-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-v1-
    
    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev openjdk-17-jdk zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip
        pip install buildozer cython
    
    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" > ~/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license
        echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > ~/.buildozer/android/platform/android-sdk/licenses/google-gdk-license
        echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > ~/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license
        echo "859f317696f67ef3d7f30a50a5560e7834b43903" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo "e9b20e7a1a1c2b5ea2e5c1b0e5c1b0e5c1b0e5c1" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
        echo "859f317696f67ef3d7f30a50a5560e7834b43903" > ~/.buildozer/android/platform/android-sdk/licenses/android-googlexr-license
        echo "Лицензии приняты!"
        ls -la ~/.buildozer/android/platform/android-sdk/licenses/
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Перегрузка: Последний Протокол
        package.name = cyberrogue
        package.domain = org.cyberrogue
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json,ttf,otf
        version = 1.0.0
        requirements = python3,pygame-ce
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, VIBRATE
        android.api = 30
        android.minapi = 21
        android.arch = arm64-v8a
        android.allow_backup = True
        android.accept_sdk_license = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
    
    - name: Build APK
      run: |
        yes | buildozer android debug || buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
