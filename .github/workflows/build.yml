name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: buildozer-v1-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-v1-
    
    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev openjdk-17-jdk zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip
        pip install buildozer cython
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Перегрузка: Последний Протокол
        package.name = cyberrogue
        package.domain = org.cyberrogue
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json,ttf,otf
        version = 1.0.0
        requirements = python3,pygame-ce
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, VIBRATE
        android.api = 30
        android.minapi = 21
        android.arch = arm64-v8a
        android.allow_backup = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
