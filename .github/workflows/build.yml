name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq python3-pip python3-dev build-essential git
        sudo apt install -y -qq libffi-dev libssl-dev zlib1g-dev
        sudo apt install -y -qq libncurses5-dev libncursesw5-dev autoconf automake libtool
        sudo apt install -y -qq pkg-config cmake unzip zip wget
        # ВАЖНО: старый cython (pygame-ce не собирается с cython 3.x)
        pip install "cython<3.0" buildozer

    - name: Install Gradle 8.0.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip
        sudo unzip -q gradle-8.0.2-bin.zip -d /opt/
        sudo ln -sfn /opt/gradle-8.0.2 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/packages
          ~/.gradle
        key: buildozer-packages-v7
        restore-keys: buildozer-packages-v7

    # ГЛАВНОЕ: создаём buildozer.spec (в её версии этого НЕ БЫЛО)
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Перегрузка: Последний Протокол
        package.name = cyberrogue
        package.domain = org.cyberrogue
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,json,ttf,otf
        version = 1.0.0
        requirements = python3,pygame-ce
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, VIBRATE
        android.api = 30
        android.minapi = 21
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.allow_backup = True
        android.accept_sdk_license = True
        android.log_level = 2

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    # Принимаем лицензии после того, как buildozer скачает cmdline-tools
    # (в её версии был вызов sdkmanager, но его ещё нет в PATH)
    - name: Build APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee build.log
      continue-on-error: false

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cyberrogue-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: ignore
        retention-days: 7
